name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.preset }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [ci-debug, ci-release]
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-catch
            mingw-w64-ucrt-x86_64-nlohmann-json
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Check the example rules with the CLI
        run: |
          ./build/${{ matrix.preset }}/bin/sirenproof.exe validate examples/state.example.json
          ./build/${{ matrix.preset }}/bin/sirenproof.exe plan --state examples/state.example.json --at 2026-11-02T10:00:00Z
          ./build/${{ matrix.preset }}/bin/sirenproof-service.exe --version

      - name: Load the main window offscreen
        run: ./build/${{ matrix.preset }}/bin/sirenproof-ui.exe --pipe '\\.\pipe\SirenproofCiNone' --screenshot ui-now.png

  extension:
    name: extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the browser extension
        run: node --test extension/tests/background.test.mjs
